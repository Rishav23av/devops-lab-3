- name: Record the local lab setup
  hosts: local
  tasks:
    - name: Create the record directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/generated"
        state: directory
        mode: "0755"
    - name: Write student details
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/generated/student.txt"
        content: "Rishav | 2301730245\n"
        mode: "0644"

- name: Configure the Docker demo node
  hosts: demo
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Copy the lab page
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html
        mode: "0644"
    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started
    - name: Check the web page
      ansible.builtin.uri:
        url: http://127.0.0.1/
        return_content: true
      register: page
      failed_when: page.status != 200 or '2301730245' not in page.content
