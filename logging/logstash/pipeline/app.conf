input {
  file {
    path => "/var/log/lab3/app.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/app.sincedb"
    codec => json
  }
}
filter {
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "rishav-lab3-%{+YYYY.MM.dd}"
  }
}
